<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sign In - AutoCare</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              fontFamily: {
                sans: ['"Aptos Display"', 'sans-serif'],
              },
              "colors": {
                    "surface": "#f7f9fb",
                    "on-primary-container": "#eeefff",
                    "primary": "#004ac6",
                    "outline-variant": "#c3c6d7",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#e6e8ea",
                    "on-surface": "#191c1e",
                    "on-surface-variant": "#434655",
                    "error": "#ba1a1a",
                    "outline": "#737686",
                    "primary-container": "#2563eb",
                    "on-primary": "#ffffff"
              }
            }
          }
        }
      </script>
</head>
<body class="bg-surface h-full flex items-center justify-center p-6 font-sans text-on-surface">
<!-- Wider Container & Larger Spacing -->
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-3xl shadow-md border border-slate-200 p-8 sm:p-10 flex flex-col gap-8 relative">
  
  <!-- Toast Notification -->
  <div id="toast" class="hidden absolute -top-16 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white text-sm font-semibold py-3 px-6 rounded-2xl shadow-xl transition-all duration-300">
    Sign in successful! Redirecting...
  </div>

  <!-- Header -->
  <div class="flex flex-col items-center text-center gap-3">
    <div class="w-20 h-20 bg-primary-container rounded-3xl flex items-center justify-center shadow-md">
      <span class="material-symbols-outlined text-[40px] text-on-primary" style="font-variation-settings: 'FILL' 1;">directions_car</span>
    </div>
    <h1 class="text-3xl font-extrabold text-primary tracking-tight">AutoCare</h1>
  </div>

  <!-- Error Message Container -->
  <div id="error-message" class="hidden bg-red-50 border border-red-200 text-error text-base p-4 rounded-2xl text-center font-medium"></div>

  <!-- Form -->
  <form id="signin-form" class="flex flex-col gap-6" onsubmit="handleSignIn(event)">
    <div class="text-center">
      <h2 class="text-xl font-bold text-on-surface">Sign In</h2>
    </div>

    <!-- UserID -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-on-surface-variant" for="userid">UserID / Username</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
          <span class="material-symbols-outlined text-[24px]">person</span>
        </span>
        <input class="w-full bg-surface-container-lowest border border-slate-300 rounded-2xl py-4 pl-12 pr-4 text-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm" id="userid" placeholder="Enter your UserID" type="text" required>
      </div>
    </div>

    <!-- Password -->
    <div class="flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <label class="text-sm font-semibold text-on-surface-variant" for="password">Password</label>
      </div>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
          <span class="material-symbols-outlined text-[24px]">lock</span>
        </span>
        <input class="w-full bg-surface-container-lowest border border-slate-300 rounded-2xl py-4 pl-12 pr-12 text-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm" id="password" placeholder="Enter your password" type="password" required>
        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-outline hover:text-on-surface">
          <span id="toggle-icon" class="material-symbols-outlined text-[24px]">visibility_off</span>
        </button>
      </div>
    </div>

    <!-- Action Button -->
    <button id="submit-btn" class="mt-2 w-full bg-primary text-on-primary font-bold text-base py-4 rounded-2xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all duration-200 flex items-center justify-center gap-3" type="submit">
      <span id="btn-text">Sign In</span>
      <span id="btn-icon" class="material-symbols-outlined text-[24px]">arrow_forward</span>
    </button>
  </form>
</div>

<!-- JavaScript Logic -->
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.textContent = 'visibility';
    } else {
      passwordInput.type = 'password';
      toggleIcon.textContent = 'visibility_off';
    }
  }

  let isSubmitting = false;

  function handleSignIn(event) {
    event.preventDefault();
    if (isSubmitting) return;

    const userIdInput = document.getElementById('userid').value.trim();
    const passwordInput = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');
    
    errorDiv.classList.add('hidden');
    if (!userIdInput || !passwordInput) {
      errorDiv.textContent = "User ID and Password cannot be empty.";
      errorDiv.classList.remove('hidden');
      return;
    }

    setLoading(true);

    // REPLACE WITH YOUR ACTUAL APPS SCRIPT WEB APP URL
    const WEB_APP_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8',
      },
      body: JSON.stringify({
        action: 'LOGIN',
        userId: userIdInput,
        password: passwordInput
      })
    })
    .then(response => response.json())
    .then(data => {
      setLoading(false);
      if (data && data.status === 'SUCCESS') {
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => {
          window.top.location.href = "https://www.google.co.in";
        }, 1200);
      } else {
        errorDiv.textContent = "Invalid User ID or Password.";
        errorDiv.classList.remove('hidden');
      }
    })
    .catch(error => {
      setLoading(false);
      errorDiv.textContent = "Invalid User ID or Password.";
      errorDiv.classList.remove('hidden');
    });
  }

  function setLoading(loading) {
    isSubmitting = loading;
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');

    if (loading) {
      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      btnText.textContent = 'Signing In...';
      btnIcon.textContent = 'hourglass_top';
    } else {
      btn.disabled = false;
      btn.classList.remove('opacity-70', 'cursor-not-allowed');
      btnText.textContent = 'Sign In';
      btnIcon.textContent = 'arrow_forward';
    }
  }
</script>
</body>
</html>
